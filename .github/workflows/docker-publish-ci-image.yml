name: CI Image

on:
  push:
    branches: ["main"]
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Validate Go and Build Inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go Packages
        run: go test ./...

      - name: Vet Go Packages
        run: go vet ./...

      - name: Run Go Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Check Scan Script Syntax
        run: bash -n scripts/scan-ci-image.sh

  build-scan-publish:
    name: Build, Scan, Publish
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      published-digest: ${{ steps.publish-image.outputs.digest }}
      published-tags: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          trivy-version: v0.74.0

      - name: Scan Source Files
        run: |
          trivy fs \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output trivy-fs.json \
            --exit-code 0 \
            .
          trivy convert --format sarif \
            --output trivy-fs.sarif trivy-fs.json

      - name: Upload Source Scan SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Enforce Source Vulnerability Gate
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-fs.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-fs.json)"
          echo "Source vulnerabilities: CRITICAL=${critical} HIGH=${high}"
          (( critical == 0 && high <= 10 ))

      - name: Prepare Image Names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="${REGISTRY}/${REPOSITORY,,}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "quarantine=${image}:quarantine-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.1"

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log In to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=sha

      - name: Build Local Scan Image
        id: build-local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: |
            ${{ steps.names.outputs.quarantine }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Local Image
        run: |
          trivy image \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --pkg-types os,library \
            --format json \
            --output trivy-image.json \
            --exit-code 0 \
            "${{ steps.names.outputs.quarantine }}"
          trivy convert --format sarif \
            --output trivy-image.sarif trivy-image.json

      - name: Upload Image Scan SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Enforce Image Vulnerability Gate
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image.json)"
          echo "Image vulnerabilities: CRITICAL=${critical} HIGH=${high}"
          (( critical == 0 && high <= 10 ))

      - name: Publish Scanned Image
        id: publish-image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SOURCE_IMAGE: ${{ steps.names.outputs.quarantine }}
          IMAGE: ${{ steps.names.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          published_digest=""
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            docker tag "${SOURCE_IMAGE}" "${tag}"
            docker push "${tag}" >/dev/null
            repo_digest="$(docker image inspect "${tag}" --format='{{json .RepoDigests}}' | jq -er --arg prefix "${IMAGE}@" '.[] | select(startswith($prefix))')"
            digest="${repo_digest##*@}"
            if [[ -z "${published_digest}" ]]; then
              published_digest="${digest}"
            elif [[ "${published_digest}" != "${digest}" ]]; then
              echo "Published tag ${tag} resolved to ${digest}, expected ${published_digest}" >&2
              exit 1
            fi
          done <<< "${TAGS}"
          [[ -n "${published_digest}" ]] || { echo "No image tags were published" >&2; exit 1; }
          echo "digest=${published_digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign Published Image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.publish-image.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      - name: Verify Published Image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.publish-image.outputs.digest }}
          WORKFLOW_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${WORKFLOW_IDENTITY}"
