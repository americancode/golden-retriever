name: CI Image

on:
  push:
    branches: ["main"]
    # Accept stable releases and prereleases such as v1.2.3-rc.1.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Validate Go and build inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go packages
        run: go test ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Run Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Check scan script syntax
        run: bash -n scripts/scan-ci-image.sh

  scan-source:
    name: Scan source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Scan source files
        run: |
          trivy fs --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output "${RUNNER_TEMP}/trivy-fs.json" --exit-code 0 .
          trivy convert --format sarif --output "${RUNNER_TEMP}/trivy-fs.sarif" "${RUNNER_TEMP}/trivy-fs.json"
      - name: Check source scan SARIF
        id: source_sarif
        if: ${{ always() }}
        run: |
          if [[ -f "${RUNNER_TEMP}/trivy-fs.sarif" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload source scan SARIF
        if: ${{ always() && steps.source_sarif.outputs.exists == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-fs.sarif
          category: trivy-fs
      - name: Enforce source vulnerability gate
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "${RUNNER_TEMP}/trivy-fs.json")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "${RUNNER_TEMP}/trivy-fs.json")"
          echo "Source vulnerabilities: CRITICAL=${critical} HIGH=${high}"
          (( critical == 0 && high <= 10 ))

  build-scan:
    name: Build and scan ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.arch }} quarantine image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=golden-retriever-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=golden-retriever-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Scan ${{ matrix.arch }} quarantine image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          source_args=()
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then source_args+=(--image-src remote); fi
          trivy image "${source_args[@]}" --platform "linux/${{ matrix.arch }}" \
            --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --pkg-types os,library \
            --format json --output "${RUNNER_TEMP}/trivy-image-${{ matrix.arch }}.json" --exit-code 0 "${IMAGE}"
          trivy convert --format sarif --output "${RUNNER_TEMP}/trivy-image-${{ matrix.arch }}.sarif" \
            "${RUNNER_TEMP}/trivy-image-${{ matrix.arch }}.json"
      - name: Check ${{ matrix.arch }} image scan SARIF
        id: image_sarif
        if: ${{ always() }}
        run: |
          if [[ -f "${RUNNER_TEMP}/trivy-image-${{ matrix.arch }}.sarif" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload ${{ matrix.arch }} image scan SARIF
        if: ${{ always() && steps.image_sarif.outputs.exists == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-image-${{ matrix.arch }}.sarif
          category: trivy-image-${{ matrix.arch }}
      - name: Enforce ${{ matrix.arch }} image vulnerability gate
        env:
          TRIVY_IMAGE_JSON: ${{ runner.temp }}/trivy-image-${{ matrix.arch }}.json
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "${TRIVY_IMAGE_JSON}")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "${TRIVY_IMAGE_JSON}")"
          echo "${{ matrix.arch }} image vulnerabilities: CRITICAL=${critical} HIGH=${high}"
          (( critical == 0 && high <= 10 ))

  publish:
    name: Publish multi-architecture CI image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    needs: [validate, scan-source, build-scan]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=sha
      - name: Promote scanned images
        id: promote
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=""
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            [[ -n "${first_tag}" ]] || first_tag="${tag}"
            docker buildx imagetools create --tag "${tag}" \
              "${IMAGE}:quarantine-${GITHUB_SHA}-amd64" "${IMAGE}:quarantine-${GITHUB_SHA}-arm64"
          done <<< "${TAGS}"
          digest=""
          for attempt in {1..10}; do
            if digest="$(docker buildx imagetools inspect "${first_tag}" 2>/dev/null | awk '/^Digest:/ { print $2; exit }')" && [[ -n "${digest}" ]]; then
              break
            fi
            echo "Waiting for ${first_tag} to become readable (attempt ${attempt}/10)..."
            sleep 3
          done
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published images
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - name: Verify published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          WORKFLOW_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${WORKFLOW_IDENTITY}"
